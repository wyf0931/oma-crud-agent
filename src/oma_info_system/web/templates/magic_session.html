<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灯神 · Wishlamp</title><link rel="stylesheet" href="/static/magic-experience.css"><script src="https://unpkg.com/lucide@latest"></script></head>
<body class="magic-workflow"><div id="magicShell" class="magic-shell">
  <aside class="magic-sidebar"><div class="magic-brand"><img src="/static/pandora-mark.svg" alt=""><span>灯神 · Wishlamp</span><button class="magic-collapse" onclick="toggleMagicSidebar()" title="折叠侧栏"><i data-lucide="chevrons-left" class="h-4 w-4"></i></button></div><a class="magic-new-world" href="/magic"><i data-lucide="sparkles" class="h-4 w-4"></i><span>创造新世界</span></a><p class="magic-world-label">我的世界</p><nav id="worldList" class="magic-worlds"></nav><footer class="magic-sidebar-footer"><a class="magic-icon-link" href="/session/{session_id}" title="切换到普通版"><i data-lucide="logs" class="h-4 w-4"></i></a><span class="magic-icon-link" title="魔法模式默认为深色"><i data-lucide="moon" class="h-4 w-4"></i></span></footer></aside>
  <main class="magic-main"><header class="magic-topbar"><a href="/magic">← 回到许愿空间</a><span id="taskTime" style="color:#aeb6d8;font-size:12px"></span></header><section class="magic-session"><div id="storyHead" class="story-head"><img src="/static/pandora-mark.svg" alt=""><div><h2 id="storyTitle">灯神正在为你创造系统…</h2><p id="storySub">这是一段魔法建造的旅程，请稍等片刻。</p></div></div>
    <div id="building" class="magic-card builder-card"><div class="builder-workscene"><img class="crafting-art" src="/static/images/wishlamp-crafting-spirit.png" alt="灯神正在加工系统"></div><h3 id="builderStatus" class="builder-status">正在理解你的愿望…</h3><p id="builderSub" class="builder-sub">灯神正在将规则、模块与数据编织成一个新世界。</p><div id="questLine" class="quest-line"></div></div>
    <div id="completed" class="magic-card complete-card hidden"><div class="complete-head"><div class="wish-wordmark">World complete</div><h1 id="worldName" class="world-title">世界已经诞生</h1><p id="worldSub" class="world-sub">正在开启传送门…</p></div><div class="complete-stage"><img class="complete-spirit" src="/static/images/wishlamp-spirit.png" alt="灯神"><div id="portal" class="portal-window hidden"><div class="portal-bar"><i class="portal-dot"></i><i class="portal-dot"></i><i class="portal-dot"></i></div><iframe id="previewFrame" title="你的新世界"></iframe></div></div><div class="world-actions"><button id="downloadButton" class="portal-download">下载项目</button></div></div>
    <div id="failed" class="magic-card magic-error hidden">这次魔法没有稳定下来，请返回普通版查看详情并重试。</div>
  </section></main>
</div><script>
const SID='{session_id}', steps=[['understand_requirements','需求理解'],['generate_modules','模块设计'],['generate_fields','字段设计'],['run_validation','设计验证'],['generate_project','生成项目'],['quality_check','自检与修复'],['output_result','完成']];let data=null,previewStarted=false,previewUrl=null;
const el=id=>document.getElementById(id); const icon=()=>window.lucide&&lucide.createIcons(); const esc=v=>{const d=document.createElement('div');d.textContent=v||'';return d.innerHTML};
function toggleMagicSidebar(){const s=el('magicShell');s.classList.toggle('sidebar-collapsed');localStorage.setItem('pandora:magic-sidebar-collapsed',s.classList.contains('sidebar-collapsed'))}if(localStorage.getItem('pandora:magic-sidebar-collapsed')==='true')el('magicShell').classList.add('sidebar-collapsed');
function milestone(raw){return ['test_launch','auto_fix'].includes(raw)?'quality_check':raw}function reached(id,h){return id==='quality_check'?h.some(x=>['test_launch','auto_fix'].includes(x)):h.includes(id)}
function renderLine(s){const h=s.step_history||[], current=milestone(s.current_step||'');el('questLine').innerHTML=steps.map((x,i)=>{const done=reached(x[0],h),active=!done&&x[0]===current;return `<div class="quest ${done?'done':active?'active':''}"><i class="quest-node">${done?'✓':active?'✦':'·'}</i><span>${x[1]}</span></div>${i<steps.length-1?`<i class="quest-link ${done?'done':''}"></i>`:''}`}).join('')}
function copy(s){const step=milestone(s.current_step||'');const map={understand_requirements:['让我看看你的愿望…','我正在理解这个世界需要的规则。'],generate_modules:['世界的骨架正在成形…','核心模块正在被召唤出来。'],generate_fields:['魔法核心正在注入细节…','数据与交互规则正在编织。'],run_validation:['魔法阵正在校验…','每一条规则都在接受检查。'],generate_project:['锻造炉已经点亮…','系统正在被铸造成真实项目。'],quality_check:['守护咒正在运行…','正在检查并修复这个世界的边界。'],output_result:['世界已经诞生','传送门已经为你开启。']};return map[step]||['灯神正在为你创造系统…','请稍等片刻。']}
function duration(s){if(!s.created_at)return '';const a=Date.parse(s.created_at),b=Date.parse(s.finished_at||new Date());if(!Number.isFinite(a)||!Number.isFinite(b))return '';const n=Math.max(0,b-a);return `总耗时 ${n<1000?Math.round(n)+'ms':n<60000?(n/1000).toFixed(1)+'s':Math.floor(n/60000)+'m '+((n%60000)/1000).toFixed(1)+'s'}`}
async function startPreview(){if(previewStarted)return;previewStarted=true;try{const r=await fetch(`/api/sessions/${SID}/preview`,{method:'POST'});if(!r.ok)throw Error();const p=await r.json();previewUrl=p.public_url||p.preview_url;el('previewFrame').src=previewUrl;el('portal').classList.remove('hidden');el('worldSub').textContent='传送门已经开启，欢迎进入你刚刚创造的世界。'}catch(e){previewStarted=false;el('worldSub').textContent='传送门暂时无法打开，你仍可下载项目。'}}
async function download(){try{const r=await fetch(`/api/sessions/${SID}/project/zip`);if(!r.ok)throw Error();const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='project.zip';a.click();URL.revokeObjectURL(u)}catch(e){alert('下载失败，请稍后重试')}}
function show(s){data=s;const [title,sub]=copy(s);el('storyTitle').textContent=title;el('storySub').textContent=sub;el('builderStatus').textContent=title;el('builderSub').textContent=sub;el('taskTime').textContent=duration(s);renderLine(s);const complete=s.status==='completed',failed=s.status==='failed';el('storyHead').classList.toggle('hidden',complete);el('building').classList.toggle('hidden',complete||failed);el('completed').classList.toggle('hidden',!complete);el('failed').classList.toggle('hidden',!failed);if(complete){el('worldName').textContent=s.project_name||'世界已经诞生';el('worldSub').textContent='你的系统已经完成，正在自动开启传送门…';startPreview()}icon()}
async function load(){try{const r=await fetch(`/api/sessions/${SID}`);show(await r.json())}catch(e){console.error(e)}}
async function worlds(){try{const r=await fetch('/api/sessions?limit=20'),d=await r.json();el('worldList').innerHTML=(d.sessions||[]).map(s=>`<a class="magic-world ${s.id===SID?'active':''}" href="/magic/session/${s.id}"><i class="world-dot ${s.status==='failed'?'failed':s.status==='pending'?'pending':''}"></i><div>${esc(s.project_name||s.user_input?.slice(0,18)||'未命名世界')}<small>${s.created_at?.slice(5,16).replace('T',' ')||''}</small></div></a>`).join('')}catch(e){console.error(e)}}
el('downloadButton').onclick=download;load();worlds();setInterval(()=>{if(!data||!['completed','failed'].includes(data.status))load()},1500);icon();
</script></body></html>

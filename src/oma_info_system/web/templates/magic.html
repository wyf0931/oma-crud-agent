<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灯神 · Wishlamp</title><link rel="stylesheet" href="/static/magic-experience.css"><script src="/static/js/lucide.min.js"></script></head>
<body class="magic-home"><div id="magicShell" class="magic-shell">
  <aside class="magic-sidebar"><div class="magic-brand"><img src="/static/pandora-mark.svg" alt=""><span>灯神 · Wishlamp</span><button class="magic-collapse" onclick="toggleMagicSidebar()" title="折叠侧栏"><i data-lucide="chevrons-left" class="h-4 w-4"></i></button></div><a class="magic-new-world" href="/magic"><i data-lucide="sparkles" class="h-4 w-4"></i><span>创造新世界</span></a><p class="magic-world-label">我的世界</p><nav id="worldList" class="magic-worlds"></nav><footer class="magic-sidebar-footer"><a class="magic-icon-link" href="/" title="切换到普通版"><i data-lucide="logs" class="h-4 w-4"></i></a><span class="magic-icon-link" title="魔法模式默认为深色"><i data-lucide="moon" class="h-4 w-4"></i></span></footer></aside>
  <main class="magic-main"><div class="magic-hero-art" aria-hidden="true"><img class="magic-hero-spirit" src="/static/images/wishlamp-spirit.png" alt=""><img class="magic-hero-lamp" src="/static/images/wishlamp-lamp.png" alt=""></div><header class="magic-topbar"><a href="/" title="切换到普通版"><i data-lucide="logs" class="h-4 w-4"></i></a><a href="/" title="普通版">普通版</a></header><section class="wish-stage"><div class="wish-wordmark">Wishlamp</div><h1>许下你的愿望</h1><p>告诉愿灯你想创造什么。你的想法将会成为一个可以进入的世界。</p><div class="wish-box"><input id="wishInput" type="text" placeholder="我想要一个办公用品管理系统，管理物品、库存、领用、采购与供应商……"><button id="wishButton" class="wish-send" title="许下愿望"><i data-lucide="arrow-right" class="h-5 w-5"></i></button></div><div class="wish-samples"><button data-prompt="我想要一个学生管理系统，包括学生档案、学科管理、教师管理、班级管理与成绩记录模块。">学生管理系统</button><button data-prompt="我想要一个仓库管理系统，包括物料档案、库存台账、入库、出库、盘点和库存预警模块。">仓库管理系统</button><button data-prompt="我想要一个 CRM 系统，包括客户档案、联系人、销售机会、跟进记录和销售漏斗模块。">CRM 系统</button></div></section></main>
</div><script>
const input=document.getElementById('wishInput'), button=document.getElementById('wishButton');
function icon(){if(window.lucide)lucide.createIcons()};
function toggleMagicSidebar(){const s=document.getElementById('magicShell');s.classList.toggle('sidebar-collapsed');localStorage.setItem('pandora:magic-sidebar-collapsed',s.classList.contains('sidebar-collapsed'))}if(localStorage.getItem('pandora:magic-sidebar-collapsed')==='true')document.getElementById('magicShell').classList.add('sidebar-collapsed');
async function loadWorlds(){try{const r=await fetch('/api/sessions?limit=20'),d=await r.json();document.getElementById('worldList').innerHTML=(d.sessions||[]).map(s=>{const n=s.project_name||s.user_input?.slice(0,18)||'未命名世界',t=s.created_at?.slice(5,16).replace('T',' ')||'';return `<a class="magic-world" href="/magic/session/${s.id}"><i class="world-dot ${s.status==='failed'?'failed':s.status==='pending'?'pending':''}"></i><div>${esc(n)}<small>${t}</small></div></a>`}).join('')||'<div class="magic-world"><div>还没有世界</div></div>'}catch(e){console.error(e)}}
function esc(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}
async function wish(){const value=input.value.trim();if(!value)return;button.disabled=true;button.innerHTML='<i data-lucide="loader-circle" class="h-5 w-5 animate-spin"></i>';icon();try{const r=await fetch('/api/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_input:value,mode:'yolo'})});if(!r.ok)throw Error(r.status);const d=await r.json();location.href='/magic/session/'+d.session_id}catch(e){alert('许愿失败，请稍后再试');button.disabled=false;button.innerHTML='<i data-lucide="arrow-right" class="h-5 w-5"></i>';icon()}}
button.onclick=wish; input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();wish()}};document.querySelectorAll('.wish-samples button').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;input.focus()});loadWorlds();icon();
</script></body></html>

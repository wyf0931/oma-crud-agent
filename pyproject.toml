[project]
name = "ohmyagent-info-system-agent"
version = "0.1.0"
description = "OhMyAgent specialist agent for generating lightweight business information systems"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "openai>=1.0.0",
    "httpx[socks]>=0.28.0",
    "python-docx>=1.0.0",
    "tinydb>=4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "agent", "codegen", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
]

dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

complete = [
    "ohmyagent-info-system-agent[web,dev]",
]

[project.scripts]
info-system-agent = "backend.main:main"
oma = "backend.main:main"

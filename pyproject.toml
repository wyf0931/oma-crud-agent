[project]
name = "ohmyagent-info-system-agent"
version = "0.1.0"
description = "OhMyAgent specialist agent for generating lightweight business information systems"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "openai>=1.0.0",
    "httpx[socks]>=0.28.0",
    "tinydb>=4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oma_info_system"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/bin",
    "/README.md",
    "/AGENTS.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
# generation/templates/ holds Jinja2 templates that render to Python, not Python.
extend-exclude = ["src/oma_info_system/generation/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["oma_info_system"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
]

dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

complete = [
    "ohmyagent-info-system-agent[web,dev]",
]

[project.scripts]
info-system-agent = "oma_info_system.__main__:main"
oma = "oma_info_system.__main__:main"

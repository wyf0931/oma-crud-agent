---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: |
          uv sync \
            --extra web \
            --extra dev \
            --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Check formatting
        run: uv run ruff format --check src tests scripts

      - name: Type check
        run: uv run --with pyright pyright src tests

      - name: Test
        run: uv run python -m pytest -q

      - name: Check release tag matches packaged version
        run: uv run python scripts/check_release_version.py

      - name: Build distributions
        run: uv build

      - name: Verify packaged data
        run: python scripts/check_wheel_contents.py
